<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - 404</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #f85149;
        }
        h2 {
            font-size: 1.8rem;
            margin: 1rem 0;
        }
        p {
            color: #8b949e;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Aradığın Sayfa Bulunamadı</h2>
        <p>Gitmek istediğin sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.</p>
        <a href="/">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
