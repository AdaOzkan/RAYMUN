<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı - 404</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #f85149;
        }
        h2 {
            font-size: 1.8rem;
            margin: 1rem 0;
        }
        p {
            color: #8b949e;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover {
            background-color: #2ea043;
        }

        /* --- FOOTER (3 Sütun + Logolar + Kıvrımlı Çizgi) --- */
footer {
    background-color: rgb(21, 21, 30);
    padding: 60px 8% 60px 8%; 
    display: flex;
    justify-content: center; 
}

.footer-links-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 80px;
    width: 100%;
    max-width: 1100px;
    padding-bottom: 50px;
    padding-right: 50px;
    margin: 0 auto;
    
    border-bottom: 14px solid #383842;
    border-right: 14px solid #383842;
    border-bottom-right-radius: 50px;
}

.footer-col {
    display: flex;
    flex-direction: column;
    height: 100%; /* Sütunların aynı yüksekliği kaplaması için */
}

.footer-col h4 {
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 25px;
    color: #27f4d2;
    text-transform: uppercase;
    font-weight: 700;
}

.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 15px; }

.footer-col ul li a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: 0.3s;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.footer-col ul li a:hover {
    color: #27f4d2;
    padding-left: 5px;
}

.apply-text { color: #27f4d2 !important; }

.social-icons {
    display: flex;
    gap: 20px;
}

.social-icons a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
}

.social-icons i {
    font-size: 24px;
    transition: 0.3s;
    cursor: pointer;
}

.social-icons i:hover {
    color: #27f4d2;
    transform: translateY(-3px);
}

/* Logolar ve Hizalama */
.footer-logo {
    margin-top: auto; 
    padding-top: 40px; 
    opacity: 0.8;
    transition: 0.3s;
}

.footer-logo:hover {
    opacity: 1;
    transform: scale(1.03);
}

.footer-logo img {
    width: 75%; 
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
}

.bottom-bar {
    background-color: #65001a;
    padding: 30px 8%;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
    color: rgba(255,255,255,0.5);
}

/* --- MOBIL UYUMLULUK --- */
@media (max-width: 992px) {
    .footer-links-container {
        gap: 40px;
    }
}

@media (max-width: 768px) {
    .menu-toggle { display: block; }

    .nav-right {
        position: fixed;
        top: 0;
        right: -100%;
        width: 80%;
        height: 100vh;
        background: rgb(21,21,30);
        flex-direction: column;
        justify-content: center;
        gap: 40px;
        transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }

    .nav-right.active { right: 0; }

    .nav-links {
        flex-direction: column;
        align-items: center;
        gap: 25px;
    }

    .nav-links a { font-size: 16px; opacity: 1; }

    .hero-content { padding: 30px 20px; width: 92%; margin-top: 130px; }
    .hero-content h1 { font-size: clamp(50px, 12vw, 75px); }

    .hero-content::before {
        width: 190px; 
        height: 190px; 
        top: -160px; 
        left: -40px; 
        transform: translateY(15px);
    }

    .countdown { 
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        max-width: 250px;
        margin: 20px auto 0 auto;
    }

    .time-box span { font-size: 24px; }
    
    /* Mobil Galeri Butonu Ayarları */
    .floating-gallery-btn {
        bottom: 20px;
        left: 20px;
        padding: 10px 18px;
        font-size: 11px;
    }

    .partners-tier {
        flex-direction: column;
        gap: 25px;
        padding: 30px 0;
    }
    
    .tier-1 span { font-size: 20px; }
    .tier-2 span { font-size: 16px; }
    .tier-3 span { font-size: 12px; }
    .tier-4 span { font-size: 14px; }

    .footer-links-container {
        grid-template-columns: 1fr;
        gap: 40px;
        padding-right: 25px;
        padding-bottom: 35px;
        border-bottom: 10px solid #383842;
        border-right: 10px solid #383842;
        border-bottom-right-radius: 35px;
        text-align: left;
    }

    .footer-logo {
        margin-top: 25px;
        padding-top: 0;
    }
    
    .social-icons { justify-content: flex-start; }
    .bottom-bar { flex-direction: column; gap: 15px; text-align: center; }
}

        /* --- YENİ EKLENEN SCROLL ANİMASYONU CSS --- */
        html { scroll-behavior: smooth; }
        
        .scroll-reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        
        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; }

        
    </style>
</head>
