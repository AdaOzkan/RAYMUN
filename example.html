<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayfelmun Parlamento Paneli - 45 Derece</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .main-card {
            background-color: #142948;
            width: 850px;
            height: 550px;
            border-radius: 24px;
            display: flex;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Sol Panel */
        .sidebar {
            width: 260px;
            background-color: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            color: white;
            z-index: 2;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            border-left: 4px solid #e74c3c;
            padding-left: 15px;
            text-transform: uppercase;
        }

        .stat-item {
            margin-bottom: 25px;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.6;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
        }

        /* Sağ Panel (Parlamento Alanı) */
        .content {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.02) 0%, transparent 70%);
        }

        /* Oturma planını komple 45 derece döndüren ana kapsayıcı */
        .parliament-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            transform: rotate(-45deg); /* Tüm yapıyı 45 derece sola yatırdık */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .parliament-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .podium {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .seat {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .seat.marked {
            background-color: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.4);
        }

        .seat:hover {
            transform: scale(1.8) !important;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="sidebar">
            <h2>RAYFELMUN</h2>
            <div class="stat-item">
                <span class="stat-label">TOPLAM DELEGE</span>
                <span class="stat-value" id="total-seats">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">DOLU KOLTUK</span>
                <span class="stat-value" style="color: #e74c3c;">25</span>
            </div>
            <div class="stat-item" style="margin-top: auto;">
                <span class="stat-label">SİSTEM DURUMU</span>
                <span class="stat-value" style="font-size: 14px; color: #2ecc71;">● CANLI BAĞLANTI</span>
            </div>
        </div>

        <div class="content">
            <!-- 45 derece dönen wrapper -->
            <div class="parliament-wrapper">
                <div class="parliament-container" id="parliament">
                    <div class="podium"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('parliament');
        const rows = 4; 
        const seatsPerRow = 10; 
        const centerX = 200; // Wrapper merkezine göre
        const centerY = 200; 
        
        let markedCount = 0;
        let totalCreated = 0;

        for (let row = 0; row < rows; row++) {
            const radius = 70 + (row * 30); 
            const seatCount = seatsPerRow + (row * 2); 

            for (let i = 0; i <= seatCount; i++) {
                const seat = document.createElement('div');
                seat.className = 'seat';

                if (markedCount < 25) {
                    seat.classList.add('marked');
                    markedCount++;
                }

                // Yarım daire (180 derece) açısını hesapla
                const angleRad = (Math.PI / seatCount) * i;
                const angleDeg = (angleRad * 180) / Math.PI;

                const x = centerX - (radius * Math.cos(angleRad));
                const y = centerY - (radius * Math.sin(angleRad));

                seat.style.left = `${x}px`;
                seat.style.top = `${y}px`;
                
                // Koltukların kendi etrafında dönmesi (kürsüye bakış) + ana wrapper'ın -45'ini kompanse etme gerekebilir
                // Ancak wrapper döndüğü için sadece yerel "merkeze bakış" açısı yeterlidir.
                seat.style.transform = `translate(-50%, -50%) rotate(${270 + angleDeg}deg)`;

                container.appendChild(seat);
                totalCreated++;
            }
        }
        document.getElementById('total-seats').innerText = totalCreated;
    </script>

</body>
</html>
